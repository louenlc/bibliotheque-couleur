<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuancier — bibliothèque de couleurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#14161B;
  --papier:#F4F4F1;
  --papier-2:#EAEAE5;
  --calage:#83867F;
  --trait:#D9D9D2;
  --accent:#14161B;
  --accent-ink:#FFFFFF;
  --rail:248px;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --texte:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--papier);color:var(--encre);font-family:var(--texte);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--encre);outline-offset:3px}

/* ---------- ossature ---------- */
.appli{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

.rail{
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid var(--trait);padding:26px 20px 40px;
  display:flex;flex-direction:column;gap:26px;background:var(--papier);
}
.marque{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em;line-height:1.05}
.marque span{display:block;font-family:var(--texte);font-weight:400;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--calage);margin-top:6px}

.recherche{position:relative}
.recherche input{
  width:100%;font-family:var(--mono);font-size:12px;padding:10px 12px 10px 30px;
  border:1px solid var(--trait);border-radius:2px;background:#fff;color:var(--encre);
}
.recherche input::placeholder{color:var(--calage)}
.recherche::before{content:'⌕';position:absolute;left:11px;top:8px;color:var(--calage);font-size:14px}

.agencement-label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--calage);margin-bottom:8px}
.agencement-boutons{display:flex;border:1px solid var(--trait);border-radius:2px;overflow:hidden}
.agencement-boutons button{flex:1;padding:7px 0;font-size:12px;font-family:var(--mono);
  border-right:1px solid var(--trait);background:#fff;transition:background .12s,color .12s}
.agencement-boutons button:last-child{border-right:none}
.agencement-boutons button:hover{background:var(--papier-2)}
.agencement-boutons button.actif{background:var(--encre);color:var(--papier)}

.familles{list-style:none;display:flex;flex-direction:column;gap:1px}
.familles a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:2px;font-size:13.5px}
.familles a:hover{background:var(--papier-2)}
.familles a.actif{background:var(--encre);color:var(--papier)}
.pastille{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.compte{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--calage)}
.familles a.actif .compte{color:rgba(244,244,241,.6)}

.rail footer{margin-top:auto;font-size:11.5px;color:var(--calage);line-height:1.45}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--trait);border-bottom-width:2px;
  border-radius:3px;padding:1px 4px;background:#fff}

.scene{padding:0 0 90px}

/* ---------- accueil ---------- */
.intro{padding:64px 44px 40px;border-bottom:1px solid var(--trait);max-width:1400px}
.intro h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,6vw,74px);
  letter-spacing:-.045em;line-height:.94;max-width:15ch}
.intro p{margin-top:20px;max-width:56ch;font-size:16.5px;color:#3B3E44}
.chiffres{display:flex;gap:34px;margin-top:32px;flex-wrap:wrap}
.chiffre b{display:block;font-family:var(--mono);font-size:21px;font-weight:500}
.chiffre span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--calage)}

.famille{padding:46px 44px 8px;max-width:1400px}
.entete-famille{display:flex;align-items:baseline;gap:14px;padding-bottom:16px;
  border-bottom:1px solid var(--trait);margin-bottom:22px}
.entete-famille h2{font-family:var(--display);font-weight:600;font-size:27px;letter-spacing:-.03em}
.entete-famille em{font-style:normal;font-size:13.5px;color:var(--calage);max-width:46ch}

.grille{display:grid;gap:14px;grid-template-columns:repeat(var(--cols,5),1fr)}

/* ---------- agencement Bento ----------
   Pavage calculé en JS : découpes aléatoires, aucun trou.
   Colonnes, lignes et position de chaque bloc sont posées en style inline. */
.grille.bento{grid-auto-rows:74px;gap:14px}
.grille.bento .chip-wrap{height:100%}
.grille.bento .chip-wrap .chip{height:100%;display:flex;flex-direction:column}
.grille.bento .chip-wrap .aplat{flex:1;height:auto;min-height:0}
.grille.bento .chip-wrap .nom{margin-top:8px}
@media (max-width:700px){.grille.bento{grid-auto-rows:64px}}

/* ---------- pastille de couleur (signature) ---------- */
.chip{display:block;text-align:left;width:100%}
.chip .aplat{
  display:block;position:relative;height:112px;border-radius:2px;overflow:hidden;isolation:isolate;
  box-shadow:inset 0 0 0 1px rgba(20,22,27,.10);
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s;
}
.chip:hover .aplat,.chip:focus-visible .aplat{transform:translateY(-4px);
  box-shadow:inset 0 0 0 1px rgba(20,22,27,.10), 0 10px 20px -10px rgba(20,22,27,.45)}
/* le code se lit par différence : toujours contrasté, quelle que soit la couleur */
.chip .code{
  position:absolute;inset:auto 0 0 0;padding:8px 9px;font-family:var(--mono);font-size:12.5px;
  font-weight:600;opacity:0;transform:translateY(4px);
  transition:opacity .15s,transform .15s;letter-spacing:.02em;
}
.chip:hover .code,.chip:focus-visible .code{opacity:1;transform:none}
.chip .nom{display:block;margin-top:9px;font-size:13.5px;font-weight:500;line-height:1.25}
.chip .meta{display:block;font-family:var(--mono);font-size:10.5px;color:var(--calage);margin-top:2px}
.chip .hors{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1.5px rgba(20,22,27,.55)}

.chip-wrap{position:relative}
.comparer-toggle{position:absolute;top:7px;left:7px;width:21px;height:21px;border-radius:50%;
  background:rgba(255,255,255,.9);color:#14161B;font-family:var(--mono);font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s,background .15s,color .15s;
  z-index:2;box-shadow:0 0 0 1px rgba(20,22,27,.15)}
.chip-wrap:hover .comparer-toggle,.comparer-toggle:focus-visible,.comparer-toggle.actif{opacity:1}
.comparer-toggle.actif{background:var(--encre);color:var(--papier)}

/* ---------- tri et filtres ---------- */
.filtres,.tri{display:flex;flex-direction:column;gap:10px}
.filtres select,.tri select{width:100%;font-family:var(--mono);font-size:12px;padding:8px 10px;
  border:1px solid var(--trait);border-radius:2px;background:#fff;color:var(--encre)}
.tri button[hidden]{display:none}
.filtre-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#3B3E44}
.filtre-check input{accent-color:var(--encre)}
.filtre-lum-lg{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--calage);margin-bottom:4px}
.filtre-lum input[type=range]{width:100%;accent-color:var(--encre);display:block}
.filtre-reset{font-size:11.5px;color:var(--calage);text-decoration:underline;align-self:flex-start}
.filtre-reset:hover{color:var(--encre)}

/* en mode palette, les réglages propres à la bibliothèque n'ont plus d'objet */
.mode-palette .outil-biblio{display:none}
.mode-palette .scene{padding-bottom:0}

/* ---------- navigation entre modes ---------- */
.modes{display:flex;flex-direction:column;gap:1px}
.modes a{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:2px;font-size:13.5px}
.modes a:hover{background:var(--papier-2)}
.modes a.actif{background:var(--encre);color:var(--papier)}
.modes a i{width:13px;height:13px;flex:none;border:1.5px solid currentColor;border-radius:2px}
.modes a.mode-pal i{border:none;background:linear-gradient(90deg,#E63946 33%,#457B9D 33% 66%,#F1FAEE 66%)}

/* ---------- générateur de palettes ---------- */
.pal{display:flex;flex-direction:column;height:100vh}
.pal-barre{display:flex;align-items:center;gap:18px;padding:14px 22px;border-bottom:1px solid var(--trait);
  flex:none;flex-wrap:wrap;background:var(--papier)}
.pal-titre{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.02em}
.pal-titre span{display:block;font-family:var(--texte);font-weight:400;font-size:11.5px;color:var(--calage);
  letter-spacing:0;margin-top:2px}
.pal-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pal-btn{font-family:var(--mono);font-size:11.5px;padding:8px 13px;border:1px solid var(--trait);
  border-radius:2px;background:#fff;display:inline-flex;align-items:center;gap:7px}
.pal-btn:hover:not(:disabled){background:var(--papier-2)}
.pal-btn:disabled{opacity:.35;cursor:not-allowed}
.pal-btn.principal{background:var(--encre);color:var(--papier);border-color:var(--encre)}
.pal-btn.principal:hover{opacity:.9;background:var(--encre)}
.pal-btn kbd{background:rgba(255,255,255,.16);border-color:transparent;color:inherit}

.pal-bandes{flex:1;display:flex;min-height:0}
.pal-bande{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  padding:22px 16px 26px;min-width:0;transition:flex-grow .25s}
.pal-outils{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:6px;
  opacity:0;transition:opacity .15s}
.pal-bande:hover .pal-outils,.pal-bande:focus-within .pal-outils{opacity:1}
.pal-outil{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;background:rgba(255,255,255,.22);color:inherit}
.pal-outil:hover{background:rgba(255,255,255,.4)}
.pal-outil.verrouille{opacity:1}
.pal-bande.est-verrouille .pal-outils{opacity:1}
.pal-nom{font-size:14px;font-weight:600;line-height:1.25;margin-top:7px;
  overflow-wrap:anywhere;text-decoration:none}
.pal-nom:hover{text-decoration:underline}
.pal-hex{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.04em;text-align:left;
  display:block;padding:0}
.pal-usage{font-size:11.5px;opacity:.72;margin-top:7px;line-height:1.4;max-width:26ch}
.pal-alerte{font-size:10.5px;opacity:.8;margin-top:8px;font-family:var(--mono)}
.pal-aide{padding:11px 22px;border-top:1px solid var(--trait);font-size:12px;color:var(--calage);flex:none}
.pal-mode button{padding:7px 14px;white-space:nowrap}
.pal-nom-voisine{opacity:.85}
.pal-nom-voisine b{font-weight:600}

/* ---------- panneau d'ajustement ---------- */
.pal-ajust{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;padding:14px 22px;
  border-bottom:1px solid var(--trait);background:var(--papier-2);flex:none}
.pal-curseur{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1}
.pal-curseur-lg{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--calage)}
.pal-curseur input[type=range]{width:100%;accent-color:var(--encre)}
.pal-ajust .filtre-reset{flex:none;padding-bottom:7px}

@media (max-width:820px){
  .pal{height:auto;min-height:100vh}
  .pal-bandes{flex-direction:column}
  .pal-bande{min-height:118px;padding:16px 18px}
  .pal-outils{top:12px;right:12px;left:auto;justify-content:flex-end;opacity:1}
}

/* ---------- plateau de comparaison ---------- */
#tray{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;
  border:1px solid var(--trait);border-radius:4px;padding:10px 14px;display:flex;align-items:center;
  gap:12px;box-shadow:0 12px 30px -12px rgba(20,22,27,.4);z-index:60}
.tray-swatches{display:flex;gap:4px}
.tray-swatches i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(20,22,27,.15)}
.tray-compte{font-family:var(--mono);font-size:11.5px;color:var(--calage);white-space:nowrap}
.tray-btn{font-family:var(--mono);font-size:11.5px;padding:7px 12px;border:1px solid var(--trait);
  border-radius:2px;background:#fff}
.tray-btn:hover{background:var(--papier-2)}
.tray-btn-principal{background:var(--encre);color:var(--papier);border-color:var(--encre)}
.tray-btn-principal:disabled{opacity:.4;cursor:not-allowed}
.tray-btn-principal:not(:disabled):hover{opacity:.9}

/* ---------- fiche ---------- */
.fiche-tete{position:relative;min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:44px;color:var(--accent-ink)}
.retour{position:absolute;top:26px;left:44px;font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;opacity:.85;display:flex;gap:8px;align-items:center}
.retour:hover{opacity:1}
.fiche-tete .fam{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.fiche-tete h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,86px);
  letter-spacing:-.045em;line-height:.94;margin:8px 0 16px}
.fiche-tete .gros-code{font-family:var(--mono);font-size:19px;letter-spacing:.04em}
.usage{margin-top:14px;max-width:52ch;font-size:15px;opacity:.9}

.bloc{padding:52px 44px;max-width:1400px;border-bottom:1px solid var(--trait)}
.bloc:last-child{border-bottom:none}
.titre-bloc{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.titre-bloc h2{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.025em}
.titre-bloc span{font-family:var(--mono);font-size:10.5px;color:var(--calage);letter-spacing:.1em;text-transform:uppercase}
.sous{color:var(--calage);font-size:13.5px;margin-bottom:26px;max-width:64ch}

.valeurs{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.valeur{border:1px solid var(--trait);border-radius:2px;background:#fff;padding:13px 14px;text-align:left;
  transition:border-color .15s,transform .15s}
.valeur:hover{border-color:var(--accent);transform:translateY(-2px)}
.valeur dt{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--calage)}
.valeur dd{font-family:var(--mono);font-size:15px;margin-top:5px;word-break:break-word}
.valeur small{display:block;font-size:11px;color:var(--calage);margin-top:6px;line-height:1.35;font-family:var(--texte)}

/* ---------- notice éditoriale ---------- */
.edito{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.edito article{border:1px solid var(--trait);border-radius:2px;background:#fff;padding:17px 19px}
.edito h3{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--calage);margin-bottom:9px}
.edito p{font-size:13.5px;line-height:1.55;color:#3B3E44}
.edito p+p{margin-top:9px}

.variation{margin-bottom:30px}
.variation h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px;color:var(--calage)}
.bande{display:flex;border-radius:2px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(20,22,27,.10)}
.bande button{flex:1;height:66px;position:relative;isolation:isolate}
.bande button span{position:absolute;inset:auto 0 0 0;font-family:var(--mono);font-size:10px;font-weight:600;
  padding:5px 4px;opacity:0;transition:opacity .15s}
.bande button:hover span,.bande button:focus-visible span{opacity:1}
.bande.avec-palier button span{opacity:1}

.harmonies{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}
.harmonie{border:1px solid var(--trait);border-radius:2px;background:#fff;overflow:hidden}
.harmonie .duo{display:flex;height:82px}
.harmonie .duo button{flex:1;position:relative;isolation:isolate}
.harmonie .duo button span{position:absolute;inset:auto 0 0 0;font-family:var(--mono);font-size:9.5px;
  font-weight:600;padding:4px;opacity:0;transition:opacity .15s}
.harmonie .duo button:hover span{opacity:1}
.harmonie .txt{padding:12px 14px}
.harmonie h4{font-size:14px;font-weight:600}
.harmonie p{font-size:12px;color:var(--calage);margin-top:4px;line-height:1.4}

/* ---------- épreuve d'impression ---------- */
.epreuve{display:grid;gap:26px;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.papiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.papier{border:1px solid var(--trait);border-radius:2px;background:#fff;overflow:hidden}
.papier .ap{height:118px;isolation:isolate;position:relative}
.papier .ap .code{position:absolute;inset:auto 0 0 0;padding:8px 9px;font-family:var(--mono);font-size:12px;
  font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;letter-spacing:.02em}
.papier .ap:hover .code{opacity:1;transform:none}
.papier .lg{padding:10px 12px}
.papier b{display:block;font-size:12.5px}
.papier code{font-family:var(--mono);font-size:11px;color:var(--calage)}
.papier em{display:block;font-style:normal;font-size:11px;color:var(--calage);margin-top:5px;line-height:1.4}

.verdict{border:1px solid var(--trait);border-radius:2px;background:#fff;padding:18px}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:2px}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:#E4F0E6;color:#1F6134}
.badge.warn{background:#FBEEDC;color:#8A5A11}
.badge.bad{background:#F8E1E1;color:#8E1F24}
.verdict p{margin-top:12px;font-size:13.5px;line-height:1.5}
.jauge{margin-top:16px}
.jauge .lg{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--calage)}
.jauge .piste{height:6px;background:var(--papier-2);border-radius:99px;margin-top:6px;overflow:hidden}
.jauge .piste i{display:block;height:100%;background:var(--encre);border-radius:99px}
.conseils{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:10px}
.conseils li{font-size:12.5px;line-height:1.45;padding-left:16px;position:relative;color:#3B3E44}
.conseils li::before{content:'';position:absolute;left:0;top:7px;width:6px;height:1px;background:var(--calage)}
.remplacement{margin-top:18px;border-top:1px solid var(--trait);padding-top:16px;display:flex;gap:12px;align-items:center}
.remplacement .pave{width:46px;height:46px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(20,22,27,.12)}
.remplacement b{display:block;font-size:12.5px}
.remplacement code{font-family:var(--mono);font-size:11.5px;color:var(--calage)}

/* ---------- accessibilité ---------- */
.contrastes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.paire{border:1px solid var(--trait);border-radius:2px;overflow:hidden;display:flex;flex-direction:column}
.paire .demo{flex:1}
.paire .demo{padding:20px 16px;font-size:17px;font-weight:600}
.paire .note{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#fff;
  font-family:var(--mono);font-size:11.5px}
.tag{font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:2px;font-family:var(--texte);font-weight:600}
.tag.ok{background:#E4F0E6;color:#1F6134}
.tag.no{background:#F8E1E1;color:#8E1F24}

.proches{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,18px);background:var(--encre);
  color:var(--papier);font-family:var(--mono);font-size:12.5px;padding:11px 18px;border-radius:2px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}

<script>
/* ============================================================
   1. MOTEUR COULEUR
   ============================================================ */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const round=(v,d=0)=>{const p=10**d;return Math.round(v*p)/p};

function hexToRgb(hex){let h=hex.replace('#','').trim();
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function rgbToHex(r,g,b){const f=v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0');
  return'#'+(f(r)+f(g)+f(b)).toUpperCase()}

function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),l=(max+min)/2;let h=0,s=0;const d=max-min;
  if(d!==0){s=l>.5?d/(2-max-min):d/(max+min);
    if(max===r)h=((g-b)/d+(g<b?6:0));else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}
  return{h,s:s*100,l:l*100}}
function hslToRgb(h,s,l){h=((h%360)+360)%360;s=clamp(s/100);l=clamp(l/100);
  const c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs(((h/60)%2)-1)),m=l-c/2;let r=0,g=0,b=0;
  if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];
  else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];
  return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255}}
const hslHex=(h,s,l)=>{const c=hslToRgb(h,s,l);return rgbToHex(c.r,c.g,c.b)};

function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;
  if(d!==0){if(max===r)h=((g-b)/d+(g<b?6:0));else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}
  return{h,s:max===0?0:(d/max)*100,v:max*100}}

function rgbToCmyk(r,g,b){const R=r/255,G=g/255,B=b/255,k=1-Math.max(R,G,B);
  if(k>=.9999)return{c:0,m:0,y:0,k:100};
  return{c:(1-R-k)/(1-k)*100,m:(1-G-k)/(1-k)*100,y:(1-B-k)/(1-k)*100,k:k*100}}

const toLin=u=>u<=.04045?u/12.92:((u+.055)/1.055)**2.4;
const toSrgb=u=>u<=.0031308?12.92*u:1.055*Math.pow(u,1/2.4)-.055;
function rgbToOklab(r,g,b){const R=toLin(r/255),G=toLin(g/255),B=toLin(b/255);
  const l=Math.cbrt(.4122214708*R+.5363325363*G+.0514459929*B);
  const m=Math.cbrt(.2119034982*R+.6806995451*G+.1073969566*B);
  const s=Math.cbrt(.0883024619*R+.2817188376*G+.6299787005*B);
  return{L:.2104542553*l+.7936177850*m-.0040720468*s,
    a:1.9779984951*l-2.4285922050*m+.4505937099*s,
    b:.0259040371*l+.7827717662*m-.8086757660*s}}
function oklabToRgb(L,a,bb){const l_=L+.3963377774*a+.2158037573*bb,
  m_=L-.1055613458*a-.0638541728*bb,s_=L-.0894841775*a-1.2914855480*bb;
  const l=l_**3,m=m_**3,s=s_**3;
  const R=4.0767416621*l-3.3077115913*m+.2309699292*s,
    G=-1.2684380046*l+2.6097574011*m-.3413193965*s,
    B=-.0041960863*l-.7034186147*m+1.7076147010*s;
  return{r:toSrgb(R)*255,g:toSrgb(G)*255,b:toSrgb(B)*255,raw:[R,G,B]}}
function rgbToOklch(r,g,b){const o=rgbToOklab(r,g,b);const C=Math.hypot(o.a,o.b);
  let H=Math.atan2(o.b,o.a)*180/Math.PI;if(H<0)H+=360;return{l:o.L,c:C,h:H}}
function oklchToRgbClipped(L,C,H){const rad=H*Math.PI/180;
  const test=c=>oklabToRgb(L,c*Math.cos(rad),c*Math.sin(rad)).raw.every(v=>v>=-.0008&&v<=1.0008);
  let c=C;
  if(!test(c)){let lo=0,hi=C;for(let i=0;i<24;i++){const mid=(lo+hi)/2;test(mid)?(lo=mid):(hi=mid)}c=lo}
  const o=oklabToRgb(clamp(L),c*Math.cos(rad),c*Math.sin(rad));
  return{r:clamp(o.r,0,255),g:clamp(o.g,0,255),b:clamp(o.b,0,255)}}
const oklchHex=(L,C,H)=>{const c=oklchToRgbClipped(L,C,H);return rgbToHex(c.r,c.g,c.b)};

function relLum(r,g,b){return .2126*toLin(r/255)+.7152*toLin(g/255)+.0722*toLin(b/255)}
function contrast(h1,h2){const a=hexToRgb(h1),b=hexToRgb(h2);
  const l1=relLum(a.r,a.g,a.b),l2=relLum(b.r,b.g,b.b);
  return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05)}
const encreLisible=hex=>contrast(hex,'#FFFFFF')>=contrast(hex,'#0B0C0E')?'#FFFFFF':'#0B0C0E';

function formats(hex){const{r,g,b}=hexToRgb(hex);
  const hsl=rgbToHsl(r,g,b),hsv=rgbToHsv(r,g,b),cmyk=rgbToCmyk(r,g,b),lch=rgbToOklch(r,g,b);
  return{hex:hex.toUpperCase(),
    rgb:`${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}`,
    cmyk:`${round(cmyk.c)}, ${round(cmyk.m)}, ${round(cmyk.y)}, ${round(cmyk.k)}`,
    hsl:`${round(hsl.h)}°, ${round(hsl.s)}%, ${round(hsl.l)}%`,
    hsv:`${round(hsv.h)}°, ${round(hsv.s)}%, ${round(hsv.v)}%`,
    oklch:`${round(lch.l*100,1)}% ${round(lch.c,3)} ${round(lch.h,1)}`,
    css:{rgb:`rgb(${Math.round(r)} ${Math.round(g)} ${Math.round(b)})`,
      hsl:`hsl(${round(hsl.h)} ${round(hsl.s)}% ${round(hsl.l)}%)`,
      oklch:`oklch(${round(lch.l*100,1)}% ${round(lch.c,3)} ${round(lch.h,1)})`},
    raw:{r,g,b,hsl,hsv,cmyk,lch}}}

function mix(hex,cible,t){const a=hexToRgb(hex),b=hexToRgb(cible);
  return rgbToHex(a.r+(b.r-a.r)*t,a.g+(b.g-a.g)*t,a.b+(b.b-a.b)*t)}

const PALIERS=[['50',.972],['100',.942],['200',.885],['300',.812],['400',.733],['500',.655],
  ['600',.575],['700',.492],['800',.414],['900',.345],['950',.245]];
function echelleTailwind(hex){const{r,g,b}=hexToRgb(hex);const base=rgbToOklch(r,g,b);
  return PALIERS.map(([label,L])=>{
    const cloche=1-Math.abs(L-.62)**1.6*1.5;
    return{label,hex:oklchHex(L,base.c*clamp(cloche,.06,1.12),base.h)}})}

function rampe(hex,type,n=10){const{r,g,b}=hexToRgb(hex);const hsl=rgbToHsl(r,g,b);const out=[];
  for(let i=0;i<n;i++){const t=i/(n-1);
    if(type==='ombres')out.push(mix(hex,'#000000',t*.9));
    else if(type==='claires')out.push(mix(hex,'#FFFFFF',t*.92));
    else if(type==='tons')out.push(mix(hex,'#808080',t*.9));
    else if(type==='saturation')out.push(hslHex(hsl.h,t*100,hsl.l));
    else if(type==='voisines')out.push(hslHex(hsl.h-45+t*90,hsl.s,hsl.l))}
  return out}

function harmonies(hex){const{r,g,b}=hexToRgb(hex);const{h,s,l}=rgbToHsl(r,g,b);
  const at=d=>hslHex(h+d,s,l);
  const lift=(dl)=>hslHex(h,s,clamp(l+dl,4,96));
  return[
    {nom:'Analogues',desc:'Teintes voisines sur le cercle. Doux, cohérent, sans tension.',colors:[at(-30),hex,at(30)]},
    {nom:'Complémentaires',desc:'Opposition directe. Contraste maximal, à doser.',colors:[hex,at(180)]},
    {nom:'Complémentaires divisées',desc:'Le punch du complémentaire, en moins brutal.',colors:[hex,at(150),at(210)]},
    {nom:'Triades',desc:'Trois teintes équidistantes. Vif et équilibré.',colors:[hex,at(120),at(240)]},
    {nom:'Tétradiques',desc:'Deux paires de complémentaires. Riche, exige une dominante.',colors:[hex,at(60),at(180),at(240)]},
    {nom:'Carré',desc:'Quatre teintes à 90°. Très dynamique, gardez une couleur majoritaire.',colors:[hex,at(90),at(180),at(270)]},
    {nom:'Monochromatique',desc:'Une seule teinte, plusieurs clartés. Sobre et sûr.',colors:[lift(28),lift(14),hex,lift(-14),lift(-26)]},
    {nom:'Composé',desc:'Un complémentaire adouci par ses voisins.',colors:[hex,at(30),at(180),at(210)]},
    {nom:'Nuances',desc:'Même teinte, saturation décroissante. Idéal pour les fonds.',colors:[hex,hslHex(h,s*.78,l),hslHex(h,s*.55,l),hslHex(h,s*.33,l),hslHex(h,s*.12,l)]}]}

/* --- gamut CMJN approximatif (référence offset couché type FOGRA51) --- */
const GAMUT=[[0,.175,.55],[25,.175,.55],[60,.170,.68],[100,.200,.90],[145,.145,.68],
  [200,.140,.65],[265,.180,.45],[310,.160,.50],[350,.175,.55],[360,.175,.55]];
function chromaMax(h,L){const H=((h%360)+360)%360;let ceil=.16,peak=.6;
  for(let i=0;i<GAMUT.length-1;i++){const[h0,c0,p0]=GAMUT[i],[h1,c1,p1]=GAMUT[i+1];
    if(H>=h0&&H<=h1){const t=(H-h0)/(h1-h0);ceil=c0+(c1-c0)*t;peak=p0+(p1-p0)*t;break}}
  return ceil*clamp(1-(Math.abs(L-peak)/.55)**1.8,.05,1)}

function profilImpression(hex){
  const{r,g,b}=hexToRgb(hex);const lch=rgbToOklch(r,g,b);const cmyk=rgbToCmyk(r,g,b);
  const tac=cmyk.c+cmyk.m+cmyk.y+cmyk.k;
  // plancher : sous 0,06 de chroma, toute couleur est reproductible sans effort
  const ceil=Math.max(chromaMax(lch.h,lch.l),.055);
  const ecart=lch.c<.06?0:Math.max(0,(lch.c-ceil)/lch.c);
  const couche=oklchHex(lch.l*.985,Math.min(lch.c,ceil),lch.h);
  const nonCouche=oklchHex(clamp(lch.l*.955+(lch.l>.55?-.012:.018)),Math.min(lch.c,ceil)*.76,lch.h);

  let verdict,ton,resume;
  if(ecart<=.02){verdict='Fidèle en quadri';ton='ok';
    resume="La couleur tient dans le gamut CMJN. L'écran et le tirage seront très proches.";}
  else if(ecart<=.14){verdict='Léger écart';ton='warn';
    resume="Perte de vivacité légère à l'impression. Acceptable sans retouche, sauf si cette couleur porte l'identité.";}
  else if(ecart<=.32){verdict='Écart marqué';ton='warn';
    resume="L'encre ne peut pas atteindre cette saturation. Le tirage sera nettement plus terne que l'écran.";}
  else{verdict='Hors gamut CMJN';ton='bad';
    resume="Irreproductible en quadri. Prévoyez une couleur de substitution, ou un ton direct.";}

  const conseils=[];
  if(tac>300)conseils.push(`Encrage total de ${round(tac)} % : au-delà des 300 % tolérés en offset couché. Demandez une réduction (GCR) au photograveur pour éviter le maculage et les temps de séchage.`);
  if(lch.l<.22&&cmyk.k>85&&tac<250)conseils.push("Pour un aplat noir profond, remplacez le 100 % noir par un noir riche : C 60 / M 40 / J 40 / N 100.");
  if(lch.l>.93)conseils.push("Très clair : sous 8 % de trame, la couleur risque de disparaître au calage. Envisagez une réserve papier plutôt qu'un aplat.");
  if(ecart>.32)conseils.push("Pour un aplat identitaire, passez en ton direct (encre Pantone) plutôt qu'en quadri : la teinte restera stable d'un tirage à l'autre.");
  if(ecart>.14&&lch.l>.5)conseils.push("Sur papier non couché, compensez en assombrissant légèrement la teinte source : le papier absorbe l'encre et éclaircit le rendu perçu.");
  if(lch.c<.03&&lch.l>.3&&lch.l<.85)conseils.push("Gris neutre : imprimez-le en noir seul plutôt qu'en quadri, une dérive de calage suffit à le faire virer vert ou rose.");
  if(!conseils.length)conseils.push("Aucune précaution particulière. Validez tout de même sur épreuve contractuelle avant le bon à tirer.");

  return{verdict,ton,resume,tac:round(tac),couche,nonCouche,
    alternative:ecart>.02?couche:null,ecart:round(ecart*100),conseils}}

/* ============================================================
   2. BIBLIOTHÈQUE
   ============================================================ */

/* index à plat */
const normaliser=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const slug=s=>normaliser(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const TOUTES=[];
BIBLIO.forEach(f=>f.nuances.forEach(([nom,hex,usage])=>{
  TOUTES.push({nom,hex,usage,famille:f.nom,familleCle:f.cle,slug:slug(nom)})}));

/* precalcul : evite de refaire les conversions a chaque rendu */
TOUTES.forEach(c=>{
  const rgb=hexToRgb(c.hex);
  c.rgb=rgb;
  c.lch=rgbToOklch(rgb.r,rgb.g,rgb.b);
  c.impression=profilImpression(c.hex);
  c.ink=encreLisible(c.hex);
});

/* ============================================================
   3. RENDU
   ============================================================ */
const scene=document.getElementById('scene');
const champ=document.getElementById('q');
const toast=document.getElementById('toast');
let minuteur;

function copier(texte){
  navigator.clipboard?.writeText(texte).then(()=>montrer(texte+' copié'))
    .catch(()=>montrer('Copie impossible dans ce contexte — sélectionnez la valeur à la main'));
}
function montrer(msg){toast.textContent=msg;toast.classList.add('vu');
  clearTimeout(minuteur);minuteur=setTimeout(()=>toast.classList.remove('vu'),1800)}

function chip(c){
  const alerte=c.impression.ton==='bad'?`<i class="hors" title="Hors gamut CMJN"></i>`:'';
  const coche=compareSelection.includes(c.hex)?'actif':'';
  return `<div class="chip-wrap">
    <a class="chip" href="#/couleur/${c.slug}">
      <span class="aplat" style="background:${c.hex}">${alerte}<span class="code" style="color:${c.ink}">${c.hex}</span></span>
      <span class="nom">${c.nom}</span>
      <span class="meta">${c.hex}</span></a>
    <button type="button" class="comparer-toggle ${coche}" data-compare="${c.hex}"
      aria-pressed="${coche==='actif'}" aria-label="Ajouter ${c.nom} au comparateur">${coche==='actif'?'✓':'+'}</button>
  </div>`;
}

const horsGamutTotal=TOUTES.filter(c=>c.impression.ton==='bad').length;

/* chroma OKLCH ramené sur 0–100 % : 0,37 est proche du maximum atteignable en sRGB */
const CHROMA_MAX=.37;
const satPourcent=c=>clamp(c.lch.c/CHROMA_MAX)*100;

/* ============================================================
   NOTICE ÉDITORIALE
   Les textes ne sont pas rédigés nuance par nuance : ils se composent
   à partir de la famille, de la clarté, du chroma, du rang de saturation
   et du profil d'impression — tous déjà calculés. Chaque affirmation est
   donc mesurée, et deux nuances voisines ne reçoivent pas la même
   formulation (la variante est tirée de l'empreinte du code hex).
   ============================================================ */

/* rang de saturation, global et dans la famille : autorise des affirmations chiffrées */
[...TOUTES].sort((a,b)=>b.lch.c-a.lch.c).forEach((c,i)=>c.rangSat=i+1);
BIBLIO.forEach(f=>{
  const groupe=TOUTES.filter(c=>c.familleCle===f.cle);
  [...groupe].sort((a,b)=>b.lch.c-a.lch.c)
    .forEach((c,i)=>{c.rangSatFamille=i+1;c.tailleFamille=groupe.length});
  // pour les familles neutres, classer par saturation n'a aucun sens : on classe par clarté
  [...groupe].sort((a,b)=>b.lch.l-a.lch.l).forEach((c,i)=>{c.rangClarteFamille=i+1});
});

const bandeClarte=L=>L<.22?'tresSombre':L<.45?'sombre':L<.72?'moyen':L<.87?'clair':'tresClair';
const bandeChroma=s=>s<8?'neutre':s<25?'desature':s<45?'moyen':s<62?'vif':'extreme';
const ADJ_L={tresSombre:'très sombre',sombre:'sombre',moyen:'de clarté moyenne',clair:'clair',tresClair:'très clair'};
const ADJ_C={neutre:'quasi neutre',desature:'peu saturé',moyen:'modérément saturé',vif:'vif',extreme:'extrêmement saturé'};
const temperature=h=>{const H=((h%360)+360)%360;
  return(H<105||H>=325)?'chaude':(H>=150&&H<295)?'froide':'tempérée'};

/* empreinte du hex : fait varier la formulation d'une nuance à l'autre */
const empreinte=hex=>{let n=0;for(let i=1;i<hex.length;i++)n=(n*31+hex.charCodeAt(i))>>>0;return n};
/* décimale à la française, pour la prose uniquement (les valeurs CSS gardent le point) */
const nbFr=(v,d=0)=>String(round(v,d)).replace('.',',');
const tirer=(liste,graine,decalage)=>liste[(graine+decalage)%liste.length];
const ordinal=n=>n===1?'le plus saturé':`le ${n}ᵉ plus saturé`;

function roleTechnique(bl,bc){
  if(bc==='neutre'||bc==='desature'){
    if(bl==='tresClair'||bl==='clair')return"fond de page, surface de carte et séparateur : elle porte les autres couleurs sans leur disputer l'attention";
    if(bl==='sombre'||bl==='tresSombre')return"fond sombre et texte long : elle tient la lecture sans fatiguer l'œil";
    return"texte secondaire et éléments d'interface : elle hiérarchise sans colorer";
  }
  if(bc==='extreme'||bc==='vif')
    return"accent ponctuel — bouton, lien, détail signalétique : en aplat large, elle sature vite la composition";
  if(bl==='tresClair'||bl==='clair')return"aplat de fond coloré et zone de respiration teintée";
  if(bl==='sombre'||bl==='tresSombre')return"aplat sombre, couverture et typographie de titre";
  return"couleur principale d'identité : assez présente pour signer, assez tenue pour durer";
}

function notice(c,cW,cB){
  const fam=EDITO_FAMILLE[c.familleCle];
  const g=empreinte(c.hex);
  const s=satPourcent(c),bl=bandeClarte(c.lch.l),bc=bandeChroma(s);
  const p=c.impression;

  /* --- Description : purement descriptive, appuyée sur les mesures ---
     sous 0,02 de chroma la teinte n'a plus de sens : on n'annonce pas de température */
  const achromatique=c.lch.c<.02;
  const description=[
    `${c.nom} est un ${fam.nom} ${ADJ_L[bl]} et ${ADJ_C[bc]}${achromatique?'':`, à dominante ${temperature(c.lch.h)}`}.`,
    `Sa clarté OKLCH s'établit à ${nbFr(c.lch.l*100)} %, pour un chroma de ${nbFr(c.lch.c,3)} — soit ${nbFr(s)} % sur l'échelle de saturation du nuancier.`
  ];

  /* --- Psychologie : effet perceptif, modulé par saturation et clarté --- */
  const psy=[`Le ${fam.nom} ${tirer(fam.psy,g,0)}.`];
  psy.push({
    extreme:"Poussé à ce niveau de saturation, l'effet devient franchement sonore : la couleur ne se laisse pas oublier, et sature vite une composition.",
    vif:"À cette saturation, l'effet est net et assumé : la couleur porte le message plutôt qu'elle ne l'accompagne.",
    moyen:"Sa saturation moyenne tempère cet effet : elle reste lisible comme couleur, sans imposer sa présence.",
    desature:"Sa faible saturation en émousse l'intensité : il en reste l'ambiance, plus le signal.",
    neutre:"Ici la teinte est presque effacée : ce qui agit n'est plus la couleur, mais sa valeur."
  }[bc]);
  const modClarte={tresSombre:"Très assombri, il gagne en gravité et en autorité.",
    sombre:"Assombri, il gagne en gravité et en autorité.",
    clair:"Éclairci, il devient plus accessible, presque léger.",
    tresClair:"À cette clarté, il ne subsiste qu'une intention de couleur."}[bl];
  if(modClarte)psy.push(modClarte);

  /* --- Signification : symbolique culturelle, explicitement située --- */
  const sens=[tirer(fam.sens,g,1)];
  const modSens={tresSombre:"Dans cette version très sombre, la lecture se déplace vers le formel et le solennel.",
    sombre:"Dans cette version sombre, la lecture se déplace vers le sérieux et le formel.",
    tresClair:"Dans cette version très claire, la symbolique s'allège : la couleur devient presque un support."}[bl];
  if(modSens)sens.push(modSens);

  /* --- Pourquoi : arguments chiffrés, tirés des mesures de la fiche --- */
  const meilleur=cW>=cB?'blanc':'noir',ratio=Math.max(cW,cB);
  /* pour une nuance quasi neutre, un rang de saturation n'aurait aucun sens : on la situe en clarté */
  const rang=bc==='neutre'
    ? `C'est ${c.rangClarteFamille===1?'le plus clair':c.rangClarteFamille===c.tailleFamille?'le plus sombre':`le ${c.rangClarteFamille}ᵉ plus clair`} des ${c.tailleFamille} ${fam.plur} de la bibliothèque.`
    : `C'est ${ordinal(c.rangSatFamille)} des ${c.tailleFamille} ${fam.plur} de la bibliothèque${c.rangSat<=12?`, et ${c.rangSat===1?'la nuance la plus saturée de tout le nuancier':`la ${c.rangSat}ᵉ plus saturée des ${TOUTES.length} nuances`}`:''}.`;
  const pourquoi=[
    rang,
    `Sur un aplat de cette couleur, le texte ${meilleur} donne le meilleur contraste (${nbFr(ratio,2)}:1) — ${ratio>=7?'largement suffisant, jusqu’au niveau AAA':ratio>=4.5?'suffisant pour du corps de texte (AA)':ratio>=3?'à réserver aux grandes tailles (AA large)':'insuffisant pour du texte : à garder pour des surfaces'}.`,
    `À l'impression, le nuancier la classe « ${p.verdict} », avec un encrage total estimé à ${nbFr(p.tac)} %.`
  ];

  /* --- Applications : rôle technique, secteurs, contrainte de support --- */
  const applications=[
    `Elle est faite pour un usage en ${roleTechnique(bl,bc)}.`,
    `On la rencontre surtout dans ${tirer(fam.secteurs,g,2)}, ${tirer(fam.secteurs,g,3)} et ${tirer(fam.secteurs,g,5)}.`,
    p.ton==='bad'?"Hors gamut CMJN : à réserver à l'écran, ou à passer en ton direct si elle doit être imprimée."
      :p.ton==='warn'?"En quadri, prévoir un affadissement par rapport à l'écran : à valider sur épreuve si elle porte l'identité."
      :"Elle passe en quadri sans perte notable : utilisable indifféremment à l'écran et au tirage."
  ];

  return{description,psy,sens,pourquoi,applications};
}

const filtreEtat={rendu:'',lMin:0,lMax:100,cMin:0,cMax:100};
const LIBELLE_RENDU={ok:'fidèle en quadri',warn:"écart à l'impression",bad:'hors gamut CMJN'};

/* ---------- tri des nuances ----------
   Le tri s'applique à l'intérieur de chaque famille : les familles gardent
   toujours leur ordre, seule la disposition des nuances change. */
let triActif='defaut';
let graineTri=Math.floor(Math.random()*1e9);

/* teinte du repère de chaque famille : sert de zéro pour le tri par teinte,
   sinon les familles à cheval sur 0°/360° (rouges, roses) se couperaient en deux */
const repereTeinte={};
BIBLIO.forEach(f=>{const r=hexToRgb(f.repere);repereTeinte[f.cle]=rgbToOklch(r.r,r.g,r.b).h});
const ecartTeinte=c=>{
  let d=c.lch.h-(repereTeinte[c.familleCle]||0);
  while(d>180)d-=360;while(d<-180)d+=360;
  return d;
};

function melanger(liste,graine){
  const rnd=generateur(graine);const a=[...liste];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

/* familles dont la teinte n'est pas un critère lisible : à ce niveau de chroma,
   l'angle de teinte n'est que du bruit et produirait un ordre incohérent.
   Blancs, gris et noirs ont une médiane sous 0,02 et une teinte étalée sur
   presque tout le cercle — preuve qu'elle n'y signifie rien ; les beiges, eux,
   restent groupés sur une soixantaine de degrés et gardent un vrai dégradé. */
const FAMILLES_NEUTRES=new Set(BIBLIO.filter(f=>{
  const cs=TOUTES.filter(c=>c.familleCle===f.cle).map(c=>c.lch.c).sort((a,b)=>a-b);
  return cs.length&&cs[Math.floor(cs.length/2)]<.02;
}).map(f=>f.cle));

function trier(liste){
  if(triActif==='defaut')return liste;
  if(triActif==='aleatoire')return melanger(liste,graineTri);
  const a=[...liste];
  if(triActif==='clarte')return a.sort((x,y)=>y.lch.l-x.lch.l);      // du plus clair au plus sombre
  if(triActif==='saturation')return a.sort((x,y)=>y.lch.c-x.lch.c);  // du plus vif au plus terne
  if(triActif==='teinte'){
    // trier(...) reçoit toujours une seule famille à la fois
    const cle=liste[0]&&liste[0].familleCle;
    if(FAMILLES_NEUTRES.has(cle))return a.sort((x,y)=>y.lch.l-x.lch.l);
    return a.sort((x,y)=>ecartTeinte(x)-ecartTeinte(y));
  }
  return a;
}

function filtresActifs(){
  return !!(filtreEtat.rendu||filtreEtat.lMin>0||filtreEtat.lMax<100
    ||filtreEtat.cMin>0||filtreEtat.cMax<100);
}

function vueAccueil(filtre=''){
  document.title='Nuancier — bibliothèque de couleurs';
  document.documentElement.style.setProperty('--accent','#14161B');
  const brut=filtre.trim();
  const fN=normaliser(brut);
  const actifs=filtresActifs();
  let corps='';
  if(fN||actifs){
    const trouve=TOUTES.filter(c=>{
      const cible=normaliser(c.nom)+' '+c.hex.toLowerCase()+' '+normaliser(c.famille)+' '+normaliser(c.usage);
      const passeTexte=!fN||cible.includes(fN);
      const passeRendu=!filtreEtat.rendu||c.impression.ton===filtreEtat.rendu;
      const l=c.lch.l*100,s=satPourcent(c);
      const passeLum=l>=filtreEtat.lMin&&l<=filtreEtat.lMax;
      const passeSat=s>=filtreEtat.cMin&&s<=filtreEtat.cMax;
      return passeTexte&&passeRendu&&passeLum&&passeSat;
    });
    const desc=[];
    if(brut)desc.push(`texte « ${brut} »`);
    if(filtreEtat.rendu)desc.push(LIBELLE_RENDU[filtreEtat.rendu]);
    if(filtreEtat.lMin>0||filtreEtat.lMax<100)desc.push(`luminosité ${filtreEtat.lMin}–${filtreEtat.lMax} %`);
    if(filtreEtat.cMin>0||filtreEtat.cMax<100)desc.push(`saturation ${filtreEtat.cMin}–${filtreEtat.cMax} %`);
    if(trouve.length){
      // regroupées par famille (et non en une seule grille) pour que les teintes
      // ne se mélangent jamais visuellement d'une ligne à l'autre
      const parFamille=BIBLIO.map(fam=>({fam,items:trier(trouve.filter(c=>c.familleCle===fam.cle))}))
        .filter(x=>x.items.length);
      corps=`<section class="famille"><div class="entete-famille"><h2>${trouve.length} résultat${trouve.length>1?'s':''}</h2>
        <em>${desc.join(' · ')}</em></div></section>` +
        parFamille.map(({fam,items})=>`
          <section class="famille">
            <div class="entete-famille"><h2>${fam.nom}</h2><em>${items.length} nuance${items.length>1?'s':''}</em></div>
            <div class="grille">${items.map(chip).join('')}</div>
          </section>`).join('');
    } else {
      corps=`<p class="vide">Aucune couleur ne correspond à ces critères. Essayez un nom de famille (rouge, sauge) ou un code hex.</p>`;
    }
  } else {
    corps=BIBLIO.map(fam=>{
      const items=trier(TOUTES.filter(c=>c.familleCle===fam.cle));
      return `<section class="famille" id="fam-${fam.cle}">
        <div class="entete-famille"><h2>${fam.nom}</h2><em>${fam.intro}</em></div>
        <div class="grille">${items.map(chip).join('')}</div>
      </section>`;
    }).join('');
  }
  scene.innerHTML=`
    <header class="intro">
      <h1>Une couleur ne vaut que par ce qu'elle devient.</h1>
      <p>${TOUTES.length} nuances rangées par famille, avec leurs conversions, leurs déclinaisons,
      leurs harmonies — et une épreuve d'impression pour chacune. Survolez une pastille pour lire son code,
      cliquez pour ouvrir sa fiche.</p>
      <div class="chiffres">
        <div class="chiffre"><b>${TOUTES.length}</b><span>nuances</span></div>
        <div class="chiffre"><b>${BIBLIO.length}</b><span>familles</span></div>
        <div class="chiffre"><b>${horsGamutTotal}</b><span>hors gamut CMJN</span></div>
        <div class="chiffre"><b>6</b><span>espaces colorimétriques</span></div>
      </div>
    </header>${corps}`;
  window.scrollTo(0,0);
}

function bande(liste,paliers){
  return `<div class="bande ${paliers?'avec-palier':''}">${liste.map((x)=>{
    const hex=paliers?x.hex:x;const lg=paliers?x.label:hex;const ink=encreLisible(hex);
    return `<button data-copie="${hex}" style="background:${hex}" title="${hex}"><span style="color:${ink}">${lg}</span></button>`
  }).join('')}</div>`;
}

/* ---------- comparateur ---------- */
/* ============================================================
   GÉNÉRATEUR DE PALETTES
   Les couleurs sont calculées sur tout l'espace HEX (comme oklchHex le fait
   déjà pour les rampes de la fiche couleur) — la bibliothèque de 512 nuances
   sert de référence pour nommer et documenter le résultat, pas de réservoir
   dans lequel piocher : une génération peut tomber sur n'importe lequel des
   16,7 millions de HEX du gamut sRGB.
   ============================================================ */
const SCHEMAS=[
  {nom:'Monochrome',ecarts:[0,0,0,0,0]},
  {nom:'Analogues',ecarts:[-32,-16,0,16,32]},
  {nom:'Complémentaires',ecarts:[0,0,180,180,0]},
  {nom:'Complémentaires divisées',ecarts:[0,150,210,0,150]},
  {nom:'Triade',ecarts:[0,120,240,0,120]},
  {nom:'Tétrade',ecarts:[0,60,180,240,0]},
  {nom:'Carré',ecarts:[0,90,180,270,0]},
  {nom:'Dominante + accent',ecarts:[0,0,0,175,0]}
];

const etatPalette={cases:[],mode:'harmonie',schema:SCHEMAS[1].nom,ajustOuvert:false,ajustBase:null};

/* la nuance nommée la plus proche d'un HEX quelconque — sert à documenter
   une couleur générée, jamais à la remplacer */
function nuanceLaPlusProche(cible,exclus,varier=true){
  const poidsTeinte=Math.min(1,cible.c/.11); // à faible chroma, la teinte ne discrimine plus
  const notes=[];
  for(const c of TOUTES){
    if(exclus.has(c.hex))continue;
    let dh=Math.abs(c.lch.h-cible.h);if(dh>180)dh=360-dh;
    notes.push({c,d:Math.hypot((c.lch.l-cible.l)*1.75,(c.lch.c-cible.c)*2.1,(dh/180)*1.15*poidsTeinte)});
  }
  if(!notes.length)return null;
  notes.sort((a,b)=>a.d-b.d);
  if(!varier)return notes[0].c;
  const lot=notes.slice(0,Math.min(7,notes.length));
  return lot[Math.floor(Math.random()*lot.length)].c;
}

/* HEX quelconque → objet de travail complet (teinte, encre, impression,
   nuance de référence pour le nom). Fonctionne pour n'importe quel HEX,
   qu'il appartienne ou non à la bibliothèque. */
function construireCouleur(hex){
  hex=hex.toUpperCase();
  const rgb=hexToRgb(hex),lch=rgbToOklch(rgb.r,rgb.g,rgb.b);
  const exact=TOUTES.find(c=>c.hex.toUpperCase()===hex);
  const voisine=exact||nuanceLaPlusProche(lch,new Set(),false);
  return{hex,lch,ink:encreLisible(hex),impression:profilImpression(hex),voisine,exact:!!exact};
}

/* tire une cible via genererCandidat() en évitant qu'elle ne tombe trop près
   d'une couleur déjà posée dans cette génération — commun aux deux modes */
function resoudreCible(resolues,genererCandidat){
  let cible,essais=0,tropProche;
  do{
    cible=genererCandidat();
    tropProche=resolues.some(r=>{
      let dh=Math.abs(r.h-cible.h);if(dh>180)dh=360-dh;
      return Math.hypot((r.l-cible.l)*1.6,(r.c-cible.c)*2.4,(dh/180)*1.1)<.09;
    });
    essais++;
  }while(tropProche&&essais<10);
  return cible;
}

function genererPalette(){
  const cases=etatPalette.cases;
  const n=cases.length;
  const verrouillees=cases.filter(x=>x.verrou&&x.couleur);
  if(verrouillees.length===n)return false; // toutes verrouillées : rien à régénérer

  const resolues=verrouillees.map(x=>x.couleur.lch);

  if(etatPalette.mode==='aleatoire'){
    // chaque case est indépendante : ni teinte partagée, ni schéma, ni gradient de clarté imposé
    etatPalette.schema=null;
    cases.forEach(cse=>{
      if(cse.verrou&&cse.couleur)return;
      const neutre=Math.random()<.22;
      const cible=resoudreCible(resolues,()=>({
        l:clamp(.06+Math.random()*.88,.05,.98),
        h:Math.random()*360,
        c:neutre?.01+Math.random()*.035:.03+Math.random()*.29
      }));
      cse.couleur=construireCouleur(oklchHex(cible.l,cible.c,cible.h));
      resolues.push(cible);
    });
    majUrlPalette();
    return true;
  }

  // mode harmonie : teinte commune, schéma, gradient de clarté imposé
  const ancre=verrouillees.find(x=>x.couleur.lch.c>.04);
  const teinteBase=ancre?ancre.couleur.lch.h:Math.random()*360;
  const schema=SCHEMAS[Math.floor(Math.random()*SCHEMAS.length)];
  etatPalette.schema=schema.nom;

  // échelle de clarté : une palette lisible a besoin d'un vrai écart clair/sombre
  const haut=.90-Math.random()*.08, bas=.24+Math.random()*.10;

  cases.forEach((cse,i)=>{
    if(cse.verrou&&cse.couleur)return;
    const t=n===1?.5:i/(n-1);
    const ecart=schema.ecarts[i%schema.ecarts.length];
    // une case sur cinq environ vire au neutre : c'est ce qui rend une palette utilisable
    const neutre=Math.random()<.22;
    const cible=resoudreCible(resolues,()=>({
      l:clamp(haut-(haut-bas)*t+(Math.random()-.5)*.06,.05,.98),
      h:((teinteBase+ecart+(Math.random()-.5)*14)%360+360)%360,
      c:neutre?.01+Math.random()*.035:.05+Math.random()*.22
    }));
    cse.couleur=construireCouleur(oklchHex(cible.l,cible.c,cible.h));
    resolues.push(cible);
  });
  majUrlPalette();
  return true;
}

function majUrlPalette(){
  const codes=etatPalette.cases.filter(x=>x.couleur).map(x=>x.couleur.hex.replace('#',''));
  if(codes.length)history.replaceState(null,'','#/palette/'+codes.join('-'));
}

function initPalette(param){
  const codes=(param||'').split('-')
    .map(s=>s.trim().toUpperCase()).filter(s=>/^[0-9A-F]{6}$/.test(s));
  if(codes.length>=2){
    etatPalette.cases=codes.slice(0,8).map(code=>({couleur:construireCouleur('#'+code),verrou:false}));
  }
  if(etatPalette.cases.length<2){
    etatPalette.cases=Array.from({length:5},()=>({couleur:null,verrou:false}));
    genererPalette();
  } else {
    majUrlPalette();
  }
}

/* ---------- panneau d'ajustement (teinte / saturation / luminosité / température) ---------- */
const AJUST_DEFAUT={teinte:0,saturation:0,luminosite:0,temperature:0};

function ouvrirAjust(){
  etatPalette.ajustOuvert=true;
  // photographie de la palette actuelle : chaque curseur reparT de zéro à partir d'ici
  etatPalette.ajustBase=etatPalette.cases.map(x=>x.couleur?{...x.couleur.lch}:null);
}
function fermerAjust(){etatPalette.ajustOuvert=false;etatPalette.ajustBase=null}

function appliquerAjustement(valeurs){
  const base=etatPalette.ajustBase;
  if(!base)return;
  const ancreChaud=42,ancreFroid=232; // orange / bleu : axe perceptuel chaud-froid
  etatPalette.cases.forEach((cse,i)=>{
    if(cse.verrou||!base[i])return; // le cadenas protège aussi des ajustements manuels
    let{l,c,h}=base[i];
    h=((h+valeurs.teinte)%360+360)%360;
    if(valeurs.temperature){
      const ancre=valeurs.temperature>0?ancreChaud:ancreFroid;
      let dh=ancre-h;while(dh>180)dh-=360;while(dh<-180)dh+=360;
      h=((h+dh*(Math.abs(valeurs.temperature)/100)*.6)%360+360)%360;
    }
    c=clamp(c*(1+valeurs.saturation/100),0,.42);
    l=clamp(l+(valeurs.luminosite/100)*.45,.03,.98);
    const hex=oklchHex(l,c,h);
    cse.couleur=construireCouleur(hex);
  });
  rafraichirBandes();
}

/* met à jour les pastilles sans reconstruire le panneau de curseurs :
   toucher .pal-ajust pendant un glisser-déposer interromprait le geste */
function rafraichirBandes(){
  etatPalette.cases.forEach((cse,i)=>{
    const c=cse.couleur;if(!c)return;
    const el=scene.querySelector(`.pal-bande[data-i="${i}"]`);
    if(!el)return;
    el.style.background=c.hex;el.style.color=c.ink;
    const boutonHex=el.querySelector('.pal-hex');
    boutonHex.textContent=c.hex.replace('#','');boutonHex.dataset.copie=c.hex;boutonHex.style.color=c.ink;
    const zoneNom=el.querySelector('.pal-nom-zone');
    if(zoneNom)zoneNom.innerHTML=rendreNomCase(c);
    let alerte=el.querySelector('.pal-alerte');
    if(c.impression.ton==='bad'&&!alerte){
      el.insertAdjacentHTML('beforeend','<div class="pal-alerte">⚠ hors gamut CMJN</div>');
    } else if(c.impression.ton!=='bad'&&alerte){alerte.remove()}
  });
}

function rendreNomCase(c){
  if(c.exact){
    return `<a class="pal-nom" href="#/couleur/${c.voisine.slug}" style="color:${c.ink}">${c.voisine.nom}</a>
      <div class="pal-usage">${c.voisine.usage}</div>`;
  }
  if(c.voisine){
    return `<div class="pal-nom pal-nom-voisine">Proche de <a href="#/couleur/${c.voisine.slug}" style="color:${c.ink};text-decoration:underline">${c.voisine.nom}</a></div>
      <div class="pal-usage">Couleur générée, hors bibliothèque.</div>`;
  }
  return `<div class="pal-usage">Couleur générée, hors bibliothèque.</div>`;
}

        appliquerAjustement({
          teinte:+document.getElementById('aj-teinte').value,
          saturation:+document.getElementById('aj-saturation').value,
          luminosite:+document.getElementById('aj-luminosite').value,
          temperature:+document.getElementById('aj-temperature').value
        });
      });
      el.addEventListener('change',majUrlPalette);
    };
    lier('aj-teinte','teinte','°');lier('aj-saturation','saturation');
    lier('aj-luminosite','luminosite');lier('aj-temperature','temperature');
  }
  window.scrollTo(0,0);
}

function vueComparateur(param){
  const hexes=[...new Set((param||'').split(',').map(h=>h.trim().toUpperCase()).filter(Boolean))].slice(0,3);
  const items=hexes.map(h=>TOUTES.find(x=>x.hex.toUpperCase()===h)).filter(Boolean);
  if(items.length<2){location.hash='#/';return}
  document.title=`Comparateur — ${items.map(i=>i.nom).join(' / ')}`;
  document.documentElement.style.setProperty('--accent','#14161B');

  const pairs=[];
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++)pairs.push([items[i],items[j]]);

  const deltaOklch=(a,b)=>{
    const dl=(a.lch.l-b.lch.l)*100,dc=(a.lch.c-b.lch.c)*100;
    let dh=Math.abs(a.lch.h-b.lch.h);dh=Math.min(dh,360-dh);
    return Math.hypot(dl,dc,dh*0.35);
  };
  const lireDelta=d=>d<4?['Quasi identiques','ok']:d<14?['Proches','ok']:d<30?['Distinctes','no']:['Très différentes','no'];

  scene.innerHTML=`
  <header class="intro" style="padding-bottom:30px">
    <button type="button" class="retour" data-precedent style="position:static;display:inline-flex;margin-bottom:18px">← Précédent</button>
    <h1 style="font-size:clamp(30px,4.5vw,52px)">Comparateur</h1>
    <p>${items.length} couleurs comparées deux à deux : contraste croisé (WCAG) et écart perceptuel (OKLCH).</p>
  </header>

  <section class="bloc">
    <div class="titre-bloc"><h2>Couleurs sélectionnées</h2><span>${items.length}</span></div>
    <div class="papiers" style="grid-template-columns:repeat(${items.length},1fr)">
      ${items.map(c=>`<div class="papier"><a class="ap" href="#/couleur/${c.slug}" style="background:${c.hex};display:block">
        <span class="code" style="color:${c.ink}">${c.hex}</span></a>
        <div class="lg"><b>${c.nom}</b><code>${c.famille}</code></div></div>`).join('')}
    </div>
  </section>

  <section class="bloc">
    <div class="titre-bloc"><h2>Contraste croisé</h2><span>WCAG 2.1</span></div>
    <p class="sous">Rapport de contraste si l'une sert de texte sur l'autre en fond.</p>
    <div class="contrastes">
      ${pairs.map(([a,b])=>{
        const r=contrast(a.hex,b.hex);
        const t=r>=7?'AAA':r>=4.5?'AA':r>=3?'AA large':'Insuffisant';
        const cl=r>=3?'ok':'no';
        return `<div class="paire"><div class="demo" style="background:${b.hex};color:${a.hex}">${a.nom} sur ${b.nom}</div>
          <div class="note"><span>${round(r,2)}:1</span><span class="tag ${cl}">${t}</span></div></div>`;
      }).join('')}
    </div>
  </section>

  <section class="bloc">
    <div class="titre-bloc"><h2>Écart perceptuel</h2><span>OKLCH</span></div>
    <p class="sous">Distance approximative en clarté, chroma et teinte — plus le nombre est bas,
    plus les couleurs sont proches à l'œil.</p>
    <div class="contrastes">
      ${pairs.map(([a,b])=>{
        const d=deltaOklch(a,b);const[t,cl]=lireDelta(d);
        return `<div class="paire"><div class="demo" style="background:${a.hex}">
          <span style="color:${a.ink}">${a.nom}</span></div>
          <div class="note"><span>Δ ${round(d,1)} vs ${b.nom}</span><span class="tag ${cl}">${t}</span></div></div>`;
      }).join('')}
    </div>
  </section>`;
  window.scrollTo(0,0);
}

/* ---------- agencement de la grille ---------- */
let agencementActif='5';
function largeurCase(pref,largeurDispo){
  const min=150,ecart=14;
  const maxParLargeur=Math.max(2,Math.floor((largeurDispo+ecart)/(min+ecart)));
  return Math.min(Number(pref),maxParLargeur);
}

/* --- pavage Bento : découpes en guillotine, donc jamais de trou ---
   Chaque bande de 6 colonnes est coupée récursivement en deux jusqu'à
   obtenir le nombre de blocs voulu. Une coupe partage toujours l'espace
   en entier, donc le pavage reste parfait quelles que soient les tailles. */
function generateur(graine){
  let s=(graine>>>0)||1;
  return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
}
const MIN_BLOC=2;                                  // aucun bloc sous 2×2
const capacite=(w,h)=>Math.floor(w/MIN_BLOC)*Math.floor(h/MIN_BLOC);

function decouper(rect,k,rnd){
  if(k<=1)return[rect];
  const{x,y,w,h}=rect;
  const sens=[];
  if(w>=MIN_BLOC*2)sens.push('v');
  if(h>=MIN_BLOC*2)sens.push('h');
  if(!sens.length)return[rect];
  // on coupe de préférence dans le sens le plus long, pour des blocs équilibrés
  const prefere=w>h?'v':h>w?'h':(rnd()<.5?'v':'h');
  const ordre=sens.includes(prefere)?[prefere,...sens.filter(s=>s!==prefere)]:sens;
  for(const s of ordre){
    const taille=s==='v'?w:h;
    const coupes=[];
    for(let p=MIN_BLOC;p<=taille-MIN_BLOC;p++)coupes.push(p);
    for(let i=coupes.length-1;i>0;i--){
      const j=Math.floor(rnd()*(i+1));[coupes[i],coupes[j]]=[coupes[j],coupes[i]];
    }
    for(const p of coupes){
      const a=s==='v'?{x,y,w:p,h}:{x,y,w,h:p};
      const b=s==='v'?{x:x+p,y,w:w-p,h}:{x,y:y+p,w,h:h-p};
      // la coupe n'est retenue que si chaque moitié peut porter sa part de blocs
      const kaMin=Math.max(1,k-capacite(b.w,b.h));
      const kaMax=Math.min(capacite(a.w,a.h),k-1);
      if(kaMin>kaMax)continue;
      const ka=kaMin+Math.floor(rnd()*(kaMax-kaMin+1));
      return[...decouper(a,ka,rnd),...decouper(b,k-ka,rnd)];
    }
  }
  return[rect];
}

function pavageBento(nb,cols,rnd){
  const blocs=[];let ligne=0;
  while(blocs.length<nb){
    const reste=nb-blocs.length;
    const hauteur=4+Math.floor(rnd()*3);            // bandes de 4 à 6 lignes
    const cap=capacite(cols,hauteur);
    // densité variable d'une bande à l'autre, sans jamais dépasser la capacité
    let k=Math.max(2,Math.round(cap*(.55+rnd()*.45)));
    k=Math.min(k,cap,reste);
    const bande=decouper({x:0,y:0,w:cols,h:hauteur},k,rnd);
    bande.forEach(b=>blocs.push({x:b.x,y:ligne+b.y,w:b.w,h:b.h}));
    ligne+=hauteur;
  }
  return blocs;
}

function colonnesBento(largeur){
  if(largeur<560)return 2;
  if(largeur<980)return 4;
  return 6;
}

function appliquerAgencement(){
  document.querySelectorAll('.grille').forEach(g=>{
    const wraps=[...g.children];
    if(agencementActif==='bento'){
      g.classList.add('bento');g.style.removeProperty('--cols');
      const largeur=g.clientWidth||g.parentElement?.clientWidth||900;
      const cols=colonnesBento(largeur);
      // graine mémorisée : le pavage reste stable au redimensionnement
      if(!g.dataset.graine)g.dataset.graine=Math.floor(Math.random()*1e9);
      const blocs=pavageBento(wraps.length,cols,generateur(Number(g.dataset.graine)));
      g.style.gridTemplateColumns=`repeat(${cols},1fr)`;
      wraps.forEach((el,i)=>{
        const b=blocs[i];
        el.style.gridArea=`${b.y+1}/${b.x+1}/span ${b.h}/span ${b.w}`;
      });
    } else {
      g.classList.remove('bento');
      g.style.removeProperty('grid-template-columns');
      wraps.forEach(el=>el.style.removeProperty('grid-area'));
      const largeur=g.clientWidth||g.parentElement?.clientWidth||900;
      g.style.setProperty('--cols',largeurCase(agencementActif,largeur));
    }
  });
}
document.getElementById('agencement-boutons').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  // recliquer sur Bento tire un nouveau pavage
  if(b.dataset.cols==='bento'&&agencementActif==='bento'){
    document.querySelectorAll('.grille').forEach(g=>delete g.dataset.graine);
    montrer('Nouvel agencement Bento');
  }
  agencementActif=b.dataset.cols;
  document.querySelectorAll('#agencement-boutons button').forEach(x=>x.classList.toggle('actif',x===b));
  appliquerAgencement();
});
let redim;
window.addEventListener('resize',()=>{clearTimeout(redim);redim=setTimeout(appliquerAgencement,120)});

  document.getElementById('nav-familles').innerHTML=BIBLIO.map(f=>
    `<li><a href="#/#fam-${f.cle}" data-fam="${f.cle}" class="${actif===f.cle?'actif':''}">

railFamilles();

/* ---------- comparateur : sélection et plateau ---------- */
let compareSelection=[];
function toggleComparaison(hex){
  const i=compareSelection.indexOf(hex);
  if(i>-1){compareSelection.splice(i,1)}
  else{
    if(compareSelection.length>=3){montrer('Comparateur limité à 3 couleurs');return}
    compareSelection.push(hex);
  }
  document.querySelectorAll(`[data-compare="${hex}"]`).forEach(b=>{
    const actif=compareSelection.includes(hex);
    b.classList.toggle('actif',actif);
    b.textContent=actif?'✓':'+';
    b.setAttribute('aria-pressed',actif);
  });
  renderTray();
}
function renderTray(){
  let tray=document.getElementById('tray');
  if(!compareSelection.length){tray?.remove();return}
  if(!tray){tray=document.createElement('div');tray.id='tray';document.body.appendChild(tray)}
  tray.innerHTML=`<div class="tray-swatches">${compareSelection.map(h=>`<i style="background:${h}" title="${h}"></i>`).join('')}</div>
    <span class="tray-compte">${compareSelection.length} sélectionnée${compareSelection.length>1?'s':''}</span>
    <button type="button" class="tray-btn" id="tray-vider">Vider</button>
    <button type="button" class="tray-btn tray-btn-principal" id="tray-comparer" ${compareSelection.length<2?'disabled':''}>Comparer</button>`;
}
function viderComparaison(){
  compareSelection=[];
  document.querySelectorAll('.comparer-toggle.actif').forEach(b=>{
    b.classList.remove('actif');b.textContent='+';b.setAttribute('aria-pressed','false');
  });
  renderTray();
}

/* ---------- filtres combinés ---------- */
const filtreRenduEl=document.getElementById('filtre-rendu');
const filtreLminEl=document.getElementById('filtre-lmin');
const filtreLmaxEl=document.getElementById('filtre-lmax');
const filtreCminEl=document.getElementById('filtre-cmin');
const filtreCmaxEl=document.getElementById('filtre-cmax');
const filtreLumVal=document.getElementById('filtre-lum-val');
const filtreSatVal=document.getElementById('filtre-sat-val');
const filtreResetBtn=document.getElementById('filtre-reset');

function borner(minEl,maxEl){
  if(Number(minEl.value)>Number(maxEl.value)){
    if(document.activeElement===minEl)maxEl.value=minEl.value;
    else minEl.value=maxEl.value;
  }
}
function majFiltres(){
  borner(filtreLminEl,filtreLmaxEl);
  borner(filtreCminEl,filtreCmaxEl);
  filtreEtat.rendu=filtreRenduEl.value;
  filtreEtat.lMin=Number(filtreLminEl.value);
  filtreEtat.lMax=Number(filtreLmaxEl.value);
  filtreEtat.cMin=Number(filtreCminEl.value);
  filtreEtat.cMax=Number(filtreCmaxEl.value);
  filtreLumVal.textContent=`${filtreEtat.lMin}–${filtreEtat.lMax} %`;
  filtreSatVal.textContent=`${filtreEtat.cMin}–${filtreEtat.cMax} %`;
  if(location.hash.startsWith('#/couleur/')||location.hash.startsWith('#/comparer/'))return;
  vueAccueil(champ.value);
}
[filtreRenduEl,filtreLminEl,filtreLmaxEl,filtreCminEl,filtreCmaxEl]
  .forEach(el=>el.addEventListener('input',majFiltres));
filtreResetBtn.addEventListener('click',()=>{
  filtreRenduEl.value='';filtreLminEl.value=0;filtreLmaxEl.value=100;
  filtreCminEl.value=0;filtreCmaxEl.value=100;
  majFiltres();
});

/* ---------- sélecteur de tri ---------- */
const triEl=document.getElementById('tri');
const triRejouerBtn=document.getElementById('tri-rejouer');
function rendreSiListe(){
  if(location.hash.startsWith('#/couleur/')||location.hash.startsWith('#/comparer/'))return;
  vueAccueil(champ.value);
}
triEl.addEventListener('change',()=>{

  rendreSiListe();

/* ---------- historique de navigation ---------- */
let pileHistorique=['#/'];
function precedent(){
  pileHistorique.pop();
  const cible=pileHistorique.pop()||'#/';
  location.hash=cible;
}

const enModePalette=()=>(location.hash||'').startsWith('#/palette');

function router(){
  const h=location.hash||'#/';
  if(pileHistorique[pileHistorique.length-1]!==h){
    pileHistorique.push(h);
    if(pileHistorique.length>50)pileHistorique.shift();
  }
  const palette=h.startsWith('#/palette');
  document.body.classList.toggle('mode-palette',palette);
  document.getElementById('mode-biblio').classList.toggle('actif',!palette);
  document.getElementById('mode-palette').classList.toggle('actif',palette);

  if(palette){
    // n'initialise qu'à l'arrivée : les régénérations passent par replaceState
    if(!etatPalette.cases.length||h.startsWith('#/palette/'))
      initPalette(h.replace('#/palette/','').replace('#/palette',''));
    vuePalette();
  }
  else if(h.startsWith('#/couleur/')){vueFiche(h.replace('#/couleur/',''));railFamilles()}
  else if(h.startsWith('#/comparer/')){vueComparateur(decodeURIComponent(h.replace('#/comparer/','')));railFamilles()}
  else{vueAccueil(champ.value);railFamilles()}
}
window.addEventListener('hashchange',router);

champ.addEventListener('input',()=>{
  if(location.hash.startsWith('#/couleur/')||location.hash.startsWith('#/comparer/')){location.hash='#/';return}
  vueAccueil(champ.value);
});

/* ---------- actions du générateur de palettes ---------- */
function actionPalette(action,i,valeur){
  // toute action de structure referme le panneau d'ajustement : mélanger les deux
  // désynchroniserait les curseurs (relatifs à un instantané) des couleurs affichées
  const structurel=new Set(['generer','verrou','retirer','ajouter','mode']);
  if(structurel.has(action)&&etatPalette.ajustOuvert)fermerAjust();

  if(action==='mode'){
    if(etatPalette.mode===valeur)return; // déjà actif : rien à faire
    etatPalette.mode=valeur;
    genererPalette(); // respecte les verrous en place
    vuePalette();
    return;
  }
  if(action==='generer'){
    if(!genererPalette())montrer('Toutes les couleurs sont verrouillées');
    else vuePalette();
    return;
  }
  if(action==='verrou'){
    etatPalette.cases[i].verrou=!etatPalette.cases[i].verrou;
    vuePalette();return;
  }
  if(action==='retirer'){
    if(etatPalette.cases.length<=2){montrer('Une palette garde au moins 2 couleurs');return}
    etatPalette.cases.splice(i,1);
    majUrlPalette();vuePalette();return;
  }
  if(action==='ajouter'){
    if(etatPalette.cases.length>=8){montrer('Palette limitée à 8 couleurs');return}
    // la nouvelle case se remplit sans toucher aux autres : on la verrouille le temps du tirage
    const anciens=etatPalette.cases.map(x=>x.verrou);
    etatPalette.cases.forEach(x=>{if(x.couleur)x.verrou=true});
    etatPalette.cases.push({couleur:null,verrou:false});
    genererPalette();
    etatPalette.cases.forEach((x,k)=>{if(k<anciens.length)x.verrou=anciens[k]});
    majUrlPalette();vuePalette();return;
  }
  if(action==='copier'){
    copier(etatPalette.cases.filter(x=>x.couleur).map(x=>x.couleur.hex).join(', '));return;
  }
  if(action==='css'){
    const lignes=etatPalette.cases.filter(x=>x.couleur).map((x,k)=>{
      const c=x.couleur;
      const repere=c.exact?c.voisine.nom:c.voisine?`proche de ${c.voisine.nom}`:'hors bibliothèque';
      return `  --couleur-${k+1}: ${c.hex}; /* ${repere} */`;
    });
    copier(':root{\n'+lignes.join('\n')+'\n}');return;
  }
  if(action==='ajuster'){
    if(etatPalette.ajustOuvert)fermerAjust();else ouvrirAjust();
    vuePalette();return;
  }
  if(action==='reinit-ajust'){
    // annule les réglages en cours : chaque case non verrouillée revient à l'instantané
    // pris à l'ouverture du panneau (pas à sa création d'origine, à l'ouverture)
    const base=etatPalette.ajustBase;
    if(base){
      etatPalette.cases.forEach((cse,k)=>{
        if(cse.verrou||!base[k])return;
        cse.couleur=construireCouleur(oklchHex(base[k].l,base[k].c,base[k].h));
      });
    }
    majUrlPalette();vuePalette();return;
  }
}

document.addEventListener('click',e=>{
  const pal=e.target.closest('[data-pal]');
  if(pal&&!pal.disabled){
    e.preventDefault();
    actionPalette(pal.dataset.pal,Number(pal.dataset.i),pal.dataset.mode);
    return;
  }
  if(e.target.id==='tray-vider'){viderComparaison();return}
  if(e.target.id==='tray-comparer'){
    if(compareSelection.length>=2)location.hash='#/comparer/'+compareSelection.join(',');
    return;
  }
  const precedentBtn=e.target.closest('[data-precedent]');
  if(precedentBtn){e.preventDefault();precedent();return}
  const toggle=e.target.closest('.comparer-toggle');
  if(toggle){e.preventDefault();e.stopPropagation();toggleComparaison(toggle.dataset.compare);return}
  const b=e.target.closest('[data-copie]');
  if(b){e.preventDefault();copier(b.dataset.copie)}
});

document.addEventListener('keydown',e=>{
  // barre espace : régénère la palette, sauf si l'on est dans un champ ou sur un bouton
  const barreEspace=e.code==='Space'||e.key===' '||e.key==='Spacebar';
  if(barreEspace&&enModePalette()){
    const cible=e.target;
    const saisie=cible instanceof HTMLElement&&
      (cible.tagName==='INPUT'||cible.tagName==='TEXTAREA'||cible.tagName==='SELECT'
       ||cible.tagName==='BUTTON'||cible.tagName==='A'||cible.isContentEditable);
    if(!saisie){e.preventDefault();actionPalette('generer');return}
  }
  if(e.key==='/'&&document.activeElement!==champ){e.preventDefault();champ.focus();champ.select()}
  if(e.key==='Escape'){
    if(document.activeElement===champ&&champ.value){champ.value='';vueAccueil()}
    else if(location.hash.startsWith('#/couleur/')||location.hash.startsWith('#/comparer/'))precedent();
  }
});

/* navigation clavier dans les grilles de pastilles */
document.addEventListener('keydown',e=>{
  const cur=document.activeElement;
  if(!(cur instanceof HTMLElement)||!cur.classList.contains('chip'))return;
  if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
  const grille=cur.closest('.grille');
  if(!grille)return;
  const chips=[...grille.querySelectorAll('.chip')];
  const idx=chips.indexOf(cur);
  const cols=getComputedStyle(grille).gridTemplateColumns.split(' ').length||1;
  let next=idx;
  if(e.key==='ArrowLeft')next=idx-1;
  else if(e.key==='ArrowRight')next=idx+1;
  else if(e.key==='ArrowUp')next=idx-cols;
  else if(e.key==='ArrowDown')next=idx+cols;
  if(next>=0&&next<chips.length){e.preventDefault();chips[next].focus()}
});

/* mise en évidence de la famille visible */
const observateur=new IntersectionObserver(entrees=>{
  if(location.hash.startsWith('#/couleur/'))return;
  const vue=entrees.filter(x=>x.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
  if(vue)railFamilles(vue.target.id.replace('fam-',''));
},{rootMargin:'-15% 0px -70% 0px'});
function observer(){document.querySelectorAll('.famille[id]').forEach(s=>observateur.observe(s))}
const _accueil=vueAccueil;
vueAccueil=function(...a){_accueil.apply(this,a);observer();appliquerAgencement()};

router();
</script>
